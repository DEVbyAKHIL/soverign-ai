name: sovereign-ai-gateway

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    ports: ["127.0.0.1:6379:6379"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    build: { context: ., dockerfile: infra/docker/gateway.Dockerfile }
    command: ["sh", "-c", "alembic upgrade head && python -m policy.sync"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    <<: *hardening
    read_only: true
    restart: "no"

  gateway:
    build: { context: ., dockerfile: infra/docker/gateway.Dockerfile }
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp"]

  frontend:
    build: { context: ., dockerfile: infra/docker/frontend.Dockerfile }
    ports: ["127.0.0.1:5173:8080"]
    depends_on: [gateway]
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]

volumes:
  pgdata:
  redisdata:
