# Optional: docker compose --profile monitoring up -d prometheus
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: gateway
    static_configs: [{ targets: ["gateway:8000"] }]
  - job_name: event-publisher
    static_configs: [{ targets: ["event-publisher:9100"] }]
  - job_name: event-producer
    static_configs: [{ targets: ["event-producer:9100"] }]
