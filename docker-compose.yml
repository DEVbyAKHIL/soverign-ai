name: sovereign-ai-gateway

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    ports: ["127.0.0.1:5432:5432"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env}", "--appendonly", "yes"]
    volumes: ["redisdata:/data"]
    ports: ["127.0.0.1:6379:6379"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  migrate:
    build: { context: ., dockerfile: infra/docker/gateway.Dockerfile }
    command: ["sh", "-c", "alembic upgrade head && python -m policy.sync"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    <<: *hardening
    read_only: true
    restart: "no"

  gateway:
    build: { context: ., dockerfile: infra/docker/gateway.Dockerfile }
    env_file: .env
    environment:
      MODEL_BACKEND_URL: ${MODEL_BACKEND_URL-http://ollama:11434/v1}
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp"]

  # Local model backend. Approved requests are forwarded here; nothing leaves the host.
  # Pull models once: docker compose exec ollama ollama pull llama3.2:3b (and nomic-embed-text)
  ollama:
    image: ollama/ollama:0.12.6
    volumes: ["ollamadata:/root/.ollama"]
    ports: ["127.0.0.1:11434:11434"]
    security_opt: ["no-new-privileges:true"]

  frontend:
    build: { context: ., dockerfile: infra/docker/frontend.Dockerfile }
    ports: ["127.0.0.1:5173:8080"]
    depends_on: [gateway]
    <<: *hardening
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx", "/var/run"]

  # Full test suite on Linux, including NER. Not started by `up`:
  #   docker compose --profile test run --rm tests
  # Uses a separate gateway_test database (created on first run) - never the app database.
  tests:
    profiles: ["test"]
    build: { context: ., dockerfile: infra/docker/test.Dockerfile }
    environment:
      ENVIRONMENT: test
      NER_MODE: required
      TEST_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/gateway_test
      PGPASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
    <<: *hardening
    tmpfs: ["/tmp"]

volumes:
  pgdata:
  redisdata:
  ollamadata:
